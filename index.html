<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Cart drawer mockup for Your Saha - interactive, built on the store's real products and pricing.">
<title>Your Saha Cart Drawer</title>
<style>html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* ============================================================
   THE STORE — a faithful slice of yoursaha.com, so the drawer
   is seen the way a customer will actually meet it.
   ============================================================ */
:root{
  --ink:#321E1E; --ink-2:#7A5F5C; --ink-3:#9C8582;
  --paper:#FFFBF8; --cream:#FAF4F0; --sand:#F1E4D3; --line:#E4D6C8; --line-2:#DED0C1;
  --pk:#FFABE5; --pk-2:#F18BDB; --pk-ink:#8A2A6B; --pk-soft:#FFF0FA; --olive:#52572E;
  --brand:Arial,sans-serif;          /* --text-font-family / --heading-font-family */
  --label:Arial,sans-serif;          /* --subheading-font-family */
  --track:-.05em;                    /* --text/heading/button-letter-spacing */
  --pill:1.875rem;                   /* --button-border-radius */
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--brand);font-size:14px;
  letter-spacing:var(--track);line-height:1.2}
h1,h2,h3,h4{margin:0;text-transform:lowercase;letter-spacing:var(--track);line-height:.92;text-wrap:balance}
img{max-width:100%}
:focus-visible{outline:2px solid var(--pk-2);outline-offset:2px;border-radius:6px}
.tab{font-variant-numeric:tabular-nums}

/* announcement bar — real copy from the live store */
.ann{background:var(--pk);color:var(--ink);text-align:center;font-size:11.5px;padding:9px 16px;line-height:1.4}
.ann b{font-weight:700}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:13px 22px}
.hdr .brand{height:26px;width:auto;display:block;flex:none}
.hdr nav{display:flex;gap:17px;font-size:12.5px;color:var(--ink);flex-wrap:wrap}
.hdr nav a{color:inherit;text-decoration:none;opacity:.8}
.hdr nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.hdr .right{margin-left:auto;display:flex;align-items:center;gap:13px;flex:none}
.hdr select{appearance:none;font-family:var(--brand);font-size:11.5px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line-2);border-radius:999px;padding:7px 27px 7px 12px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 11px) 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.cartbtn{position:relative;appearance:none;background:none;border:0;cursor:pointer;color:var(--ink);
  font-size:18px;line-height:1;padding:4px}
.cartbtn i{position:absolute;top:-3px;right:-6px;background:var(--pk);color:var(--ink);font-style:normal;
  font-family:var(--brand);font-size:9.5px;font-weight:700;border-radius:999px;min-width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;padding:0 4px}
@media (max-width:760px){ .hdr nav{display:none} }

/* shop grid */
.shop{max-width:1060px;margin:0 auto;padding-inline:22px;padding-block:34px 60px}
.shop .lead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;margin-bottom:22px}
.shop h1{font-size:clamp(30px,5vw,46px);font-weight:700}
.shop .lead p{margin:0;font-size:12.5px;color:var(--ink-2);max-width:40ch;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:22px 16px}
.pc{display:flex;flex-direction:column;gap:8px}
.pc .ph{aspect-ratio:1/1.12;border-radius:12px;overflow:hidden;background:var(--cream)}
.pc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pc h3{font-size:14px;font-weight:700}
.pc .st{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2)}
.pc .pr{font-size:13.5px;font-weight:700;margin-top:-2px}
.pc .buy{margin-top:auto;appearance:none;cursor:pointer;border:1px solid var(--ink);background:var(--paper);
  color:var(--ink);border-radius:999px;font-size:12px;font-weight:700;padding:10px;font-family:var(--brand)}
.pc .buy:hover{background:var(--ink);color:var(--paper)}
.stars{color:var(--pk-2);letter-spacing:.5px;font-size:10px}

/* instagram feed — InstaFeed, homepage + product pages */
.ig{border-top:1px solid var(--line);background:var(--cream);padding-block:36px 44px}
.ig .in{max-width:1060px;margin:0 auto;padding-inline:22px}
.ig .hd{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-bottom:18px}
.ig h2{font-size:clamp(24px,3.6vw,34px);font-weight:700}
.ig .hd a{margin-left:auto;font-size:12px;color:var(--ink);text-decoration:none;border:1px solid var(--ink);
  border-radius:999px;padding:9px 16px;font-weight:700}
.ig .hd a:hover{background:var(--ink);color:var(--paper)}
.ig .hd p{margin:0;font-size:12.5px;color:var(--ink-2)}
.igrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media (min-width:560px){ .igrid{grid-template-columns:repeat(4,1fr)} }
@media (min-width:940px){ .igrid{grid-template-columns:repeat(8,1fr)} }
.igt{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sand);display:block}
.igt img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.igt:hover img{transform:scale(1.06)}
.igt .ov{position:absolute;inset:0;background:rgba(50,30,30,.34);opacity:0;transition:opacity .25s;
  display:flex;align-items:center;justify-content:center;gap:5px;color:#fff;font-size:11.5px;font-weight:700}
.igt:hover .ov{opacity:1}
.igt .shop{position:absolute;left:7px;bottom:7px;background:var(--paper);color:var(--ink);font-size:9px;
  font-weight:700;border-radius:999px;padding:3px 7px;letter-spacing:.02em}

/* page scrim + drawer shell */
.pagescrim{position:fixed;inset:0;background:rgba(50,30,30,.44);z-index:40;opacity:1;transition:opacity .3s}
.pagescrim.closed{opacity:0;pointer-events:none}
.drawerwrap{position:fixed;top:0;right:0;bottom:0;z-index:45;display:flex;align-items:stretch;
  transform:translateX(0);transition:transform .34s cubic-bezier(.4,0,.2,1);max-width:100vw}
.drawerwrap.closed{transform:translateX(101%)}

/* ---- [p4] complete your hammam ritual — the companion panel ---- */
.ritualpanel{display:none;width:352px;flex:none;background:var(--cream);border-right:1px solid var(--line);
  overflow-y:auto;overscroll-behavior:contain;padding:20px 18px 22px;
  --ink:#321E1E;--ink-2:#7A5F5C;--ink-3:#9C8582;--paper:#FFFBF8;--cream:#FAF4F0;--sand:#F1E4D3;
  --line:#E4D6C8;--line-2:#DED0C1;--pk:#FFABE5;--pk-2:#F18BDB;--pk-ink:#8A2A6B;--pk-soft:#FFF0FA;--olive:#52572E;
  color:var(--ink);font-family:var(--brand)}
@media (min-width:1000px){ .ritualpanel{display:block} }
.ritualpanel .kick{text-align:center;font-size:9.5px;letter-spacing:.02em;text-transform:lowercase;color:var(--ink-2)}
.ritualpanel h2{text-align:center;font-size:31px;font-weight:700;margin-top:4px;letter-spacing:-.05em}
.ritualpanel .strap{text-align:center;font-size:9px;letter-spacing:.02em;text-transform:lowercase;
  color:var(--ink-2);margin-top:7px}
/* step tracker */
.rsteps{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;position:relative}
.rstep{text-align:center;position:relative}
.rstep .dot{width:29px;height:29px;border-radius:999px;margin:0 auto;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;background:var(--sand);color:var(--ink-3);
  position:relative;z-index:2;border:2px solid var(--cream);transition:background .3s,color .3s}
.rstep.on .dot{background:var(--olive);color:#fff}
.rstep.next .dot{background:var(--pk);color:var(--ink)}
.rstep .bar{position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line-2);z-index:1}
.rstep.on .bar{background:var(--olive)}
.rstep:first-child .bar{display:none}
.rstep .nm{font-size:9.5px;letter-spacing:.02em;text-transform:lowercase;font-weight:700;margin-top:8px}
.rstep .sb{font-size:10.5px;color:var(--ink-2);font-style:italic;margin-top:2px}
.rstep:not(.on) .nm{color:var(--ink-3)}
/* banner */
.rban{background:var(--pk-soft);border:1px solid rgba(138,42,107,.14);border-radius:13px;padding:13px 14px;margin-top:18px}
.rban .t{font-size:19px;font-weight:700;letter-spacing:-.03em;color:var(--pk-ink)}
.rban p{margin:5px 0 0;font-size:12px;color:var(--ink-2);line-height:1.5}
/* next-step cards */
.rcards{display:flex;flex-direction:column;gap:9px;margin-top:13px}
.rcard{display:grid;grid-template-columns:62px minmax(0,1fr);gap:11px;background:var(--paper);
  border:1px solid var(--line-2);border-radius:13px;padding:9px;align-items:center}
.rcard img{width:62px;height:66px;object-fit:cover;border-radius:9px;background:var(--cream);display:block}
.rcard .nm{font-size:13px;font-weight:700;line-height:1.2;text-transform:lowercase}
.rcard .mt{font-size:11px;color:var(--ink-2);margin-top:3px}
.rcard .st{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-2);margin-top:3px}
.rcard .go{margin-top:7px;width:100%;appearance:none;cursor:pointer;border:0;border-radius:999px;
  background:var(--olive);color:#fff;font-size:11.5px;font-weight:700;padding:8px;font-family:var(--brand)}
.rcard .go:hover{background:var(--ink)}
/* complete the ritual */
.rfull{margin-top:15px;background:var(--sand);border-radius:14px;padding:14px;position:relative}
.rfull .bv{position:absolute;top:10px;right:12px;font-size:10px;font-style:italic;color:var(--pk-ink);font-weight:700}
.rfull h3{font-size:19px;font-weight:700;letter-spacing:-.04em}
.rfull p{margin:5px 0 0;font-size:11.5px;color:var(--ink-2);line-height:1.45;max-width:26ch}
.rfull img{width:74px;height:74px;object-fit:cover;border-radius:10px;position:absolute;right:12px;bottom:56px;
  background:var(--paper)}
.rfull .go{margin-top:12px;width:100%;appearance:none;cursor:pointer;border:0;border-radius:999px;
  background:var(--olive);color:#fff;font-size:12.5px;font-weight:700;padding:11px;font-family:var(--brand)}
.rfull .go:hover{background:var(--ink)}
.rfull .go s{opacity:.62;font-weight:400}
/* compact tracker inside the drawer for narrow screens */
.rtmini{padding:13px 18px;border-bottom:1px solid var(--line);background:var(--cream)}
.rtmini .lb{font-size:9.5px;letter-spacing:.02em;text-transform:lowercase;color:var(--ink-2);
  text-align:center;margin-bottom:10px}
@media (min-width:1000px){ .rtmini{display:none} }
/* ============================================================
   THE DRAWER — Your Saha brand system (fixed palette, not themed)
   Tokens lifted from the live theme's colour schemes.
   ============================================================ */
.drawer{
  --ink:#321E1E; --ink-2:#7A5F5C; --ink-3:#9C8582;
  --paper:#FFFBF8; --cream:#FAF4F0; --sand:#F1E4D3; --line:#E4D6C8; --line-2:#DED0C1;
  --pk:#FFABE5; --pk-2:#F18BDB; --pk-ink:#8A2A6B; --pk-soft:#FFF0FA;
  --olive:#52572E;
  font-family:var(--brand);color:var(--ink);background:var(--paper);
  width:min(428px,100vw);height:100%;flex:none;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:-18px 0 60px -18px rgba(50,30,30,.42);
}
.drawer h2,.drawer h3,.drawer h4{text-transform:lowercase;letter-spacing:-.045em;line-height:.95}
.drawer button{font-family:var(--brand)}
.drawer :focus-visible{outline:2px solid var(--pk-2);outline-offset:2px;border-radius:6px}
.tab{font-variant-numeric:tabular-nums}

/* drawer header */
.dhead{display:flex;align-items:center;gap:10px;padding:15px 18px 13px;border-bottom:1px solid var(--line);
  background:var(--paper);flex:none}
.dhead .logo{height:23px;width:auto;display:block}
.dhead .count{font-family:var(--label);font-size:10px;letter-spacing:.06em;background:var(--pk);color:var(--ink);
  border-radius:999px;padding:3px 8px;font-weight:600}
.dhead .x{margin-left:auto;appearance:none;background:none;border:0;cursor:pointer;color:var(--ink);
  font-size:19px;line-height:1;padding:4px 2px;opacity:.55}
.dhead .x:hover{opacity:1}

/* scroll body */
.dbody{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.dsec{padding:14px 18px;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:0}

/* [1] shipping / intl progress */
.ship{background:var(--cream);padding:13px 18px;border-bottom:1px solid var(--line)}
.ship .row{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:1.35}
.ship .row strong{font-weight:700}
.ship .amt{margin-left:auto;font-family:var(--label);font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.track{height:7px;border-radius:999px;background:var(--sand);margin-top:9px;overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pk),var(--pk-2));
  transition:width .45s cubic-bezier(.4,0,.2,1)}
.ship.done .track i{background:var(--olive)}
.ship .won{color:var(--olive);font-weight:700}


/* line items */
.line{display:grid;grid-template-columns:70px minmax(0,1fr);gap:13px;padding:15px 18px;border-bottom:1px solid var(--line)}
.line .thumb{width:70px;height:78px;border-radius:10px;background:var(--cream);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.line .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.line .top{display:flex;gap:10px;align-items:flex-start}
.line h4{font-size:14.5px;font-weight:700;flex:1;min-width:0}
.line .vr{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.line .rm{appearance:none;background:none;border:0;cursor:pointer;color:var(--ink-3);font-family:var(--label);
  font-size:10px;letter-spacing:.02em;text-transform:lowercase;padding:2px;flex:none}
.line .rm:hover{color:#B2413C}
.line .prow{display:flex;align-items:center;gap:10px;margin-top:9px}
.line .autotag{margin-top:5px;font-size:10px;letter-spacing:.02em;text-transform:lowercase;color:var(--pk-ink);
  background:var(--pk-soft);border-radius:999px;padding:3px 9px;display:inline-block}
.line .autotag button{appearance:none;background:none;border:0;cursor:pointer;color:var(--pk-ink);
  font-size:10px;text-transform:lowercase;letter-spacing:.02em;text-decoration:underline;
  text-underline-offset:2px;padding:0}
.qty{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.qty button{appearance:none;background:none;border:0;cursor:pointer;width:26px;height:26px;font-size:14px;
  color:var(--ink);line-height:1}
.qty button:hover{background:var(--cream)}
.qty span{min-width:18px;text-align:center;font-family:var(--label);font-size:11.5px}
.price{margin-left:auto;text-align:right;font-size:14px;font-weight:700}
.price s{display:block;font-size:11px;font-weight:400;color:var(--ink-3)}

/* [3][8] purchase options — a faithful port of the subscription widget
   running on yoursaha.com today: two radio rows, a -10% tag, and the
   30/60/90-day cadence select that opens under the subscribe row. */
.sub{margin-top:12px}
.sub .polab{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:11px;color:var(--ink-2)}
.sub .polab::before,.sub .polab::after{content:"";flex:1;height:1px;background:var(--line-2)}
.sub .popts{border:1.5px solid var(--ink);border-radius:11px;overflow:hidden;background:var(--paper)}
.sub .popt{display:flex;align-items:center;gap:9px;width:100%;appearance:none;border:0;cursor:pointer;
  background:var(--paper);padding:11px 11px;text-align:left;font-family:var(--brand);color:var(--ink)}
.sub .wrap{border-top:1.5px solid var(--ink)}
.sub .wrap[data-on="1"] .popt{background:var(--pk)}
.sub .popt .dot{flex:none;width:16px;height:16px;border-radius:999px;border:1.5px solid var(--ink);
  background:var(--paper);display:grid;place-items:center}
.sub .popt[aria-pressed="true"] .dot::after{content:"";width:8px;height:8px;border-radius:999px;background:var(--ink)}
.sub .popt .nm{font-size:12.5px;font-weight:700;line-height:1.2;white-space:nowrap}
/* the black angled "-10%" flag, tail pointing back at the option name */
.sub .popt .tag{flex:0 1 auto;min-width:0;background:var(--ink);color:#FFF6FC;font-size:9.5px;font-weight:700;
  padding:3px 8px 3px 11px;transform:rotate(-7deg);letter-spacing:.02em;line-height:1.25;
  clip-path:polygon(0 50%,7px 0,100% 0,100% 100%,7px 100%)}
.sub .popt .pr{margin-left:auto;font-size:12.5px;font-weight:700;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.sub .popt .pr small{font-weight:400;font-size:10.5px;color:var(--ink-2)}
.sub .wrap[data-on="1"] .popt .pr small{color:var(--pk-ink)}
/* the cadence panel, only present once subscribe is the chosen option */
.sub .pbody{background:var(--pk-soft);padding:10px 12px 11px;border-top:1px solid rgba(138,42,107,.18)}
.sub .pbody .lb{display:block;font-size:11px;color:var(--ink-2);margin-bottom:6px}
.sub .pbody select{width:100%;appearance:none;cursor:pointer;font-family:var(--brand);font-size:12.5px;
  font-weight:700;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:9px;
  padding:9px 30px 9px 11px;line-height:1.2;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 17px) 54%,calc(100% - 12px) 54%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
@media (max-width:420px){
  .sub .popt{gap:7px;padding:10px 9px}
  .sub .popt .nm,.sub .popt .pr{font-size:11.5px}
  .sub .popt .tag{font-size:9px;padding:3px 6px 3px 9px}
  .sub .popt .pr small{font-size:9.5px}
}
.sub .hiw-link{display:block;margin-top:7px;appearance:none;background:none;border:0;cursor:pointer;padding:0;
  font-family:var(--brand);font-size:10.5px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.sub .hiw-link:hover{color:var(--pk-ink)}
/* cadence line on the cart row itself, so a subscribed item reads as one at a glance */
.line .subtag{margin-top:5px;font-size:10px;letter-spacing:.02em;text-transform:lowercase;color:var(--pk-ink)}
/* the savings rows now live only in the benefits modal, so they are scoped to
   the class rather than to .sub — where they had never actually matched */
.calc{padding:9px 11px;display:flex;flex-direction:column;gap:5px;background:var(--pk-soft)}
.calc .r{display:flex;font-size:11.5px;color:var(--ink-2)}
.calc .r b{margin-left:auto;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.calc .r.big{font-size:12.5px;color:var(--pk-ink);padding-top:5px;border-top:1px solid rgba(138,42,107,.16)}
.calc .r.big b{color:var(--pk-ink);font-weight:700}
.perks{display:flex;gap:9px;flex-wrap:wrap;padding:8px 11px 10px;background:var(--pk-soft);
  border-top:1px solid rgba(138,42,107,.1)}
.perks span{font-family:var(--label);font-size:9.5px;letter-spacing:.02em;text-transform:lowercase;color:var(--pk-ink)}

/* [2] conditional upsell prompt */
.prompt{margin:0;padding:15px 18px;background:linear-gradient(170deg,#FFF0FA,#FFE3F6);border-bottom:1px solid var(--line)}
.prompt .eb{font-family:var(--label);font-size:9.5px;letter-spacing:.02em;text-transform:lowercase;color:var(--pk-ink)}
.prompt h3{font-size:19px;font-weight:700;margin-top:6px;color:var(--ink)}
.prompt p{font-size:12.5px;color:var(--ink-2);margin:6px 0 0;line-height:1.5;max-width:44ch}
.prompt .deal{display:flex;align-items:center;gap:8px;margin-top:11px;font-family:var(--label);font-size:10.5px;
  letter-spacing:.02em;text-transform:lowercase;color:var(--pk-ink)}
.offers{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.offer{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:11px;align-items:center;
  background:var(--paper);border-radius:12px;padding:9px 11px 9px 9px;border:1px solid rgba(138,42,107,.14)}
.offer img{width:52px;height:56px;object-fit:cover;border-radius:8px;background:var(--cream);display:block}
.offer .nm{font-size:13px;font-weight:700;line-height:1.2;text-transform:lowercase}
.offer .mt{font-size:11px;color:var(--ink-2);margin-top:3px;line-height:1.35}
.offer .st{display:flex;align-items:center;gap:4px;margin-top:4px;font-family:var(--label);font-size:9.5px;color:var(--ink-2)}

      p:"Exfoliate first, then treat. Skin absorbs a mask far better straight after the duo — this is the step most people skip.",
      offers:['nila','ghassoul']};
  if(hasTag('mask') && !has('duo') && !has('black-soap'))
    return{eb:"masks work better on prepped skin",h:"combine it with the exfoliation duo",
      p:"Pair your mask with the duo, or layer a second mask — the nila and ghassoul are made to be mixed.",
      offers:['duo','ghassoul','nila'].filter(h=>!has(h))};
  if(hasTag('mask') && !hasTag('oil'))
    return{eb:"one last step",h:"seal it in with argan oil",
      p:"After a mask, skin takes oil beautifully. This is the finish that makes the whole routine hold.",
      offers:['argan','rosewater']};
  // nothing specific matched — pick up the next unfinished step of the ritual so a
  // cart of accessories still gets a prompt instead of going silent
  const done=RITUAL.map(r=>r.items.some(h=>has(h)));
  const i=done.findIndex(x=>!x);
  if(i>-1){
    const r=RITUAL[i], picks=r.items.filter(h=>!has(h)).slice(0,3);
    if(picks.length) return{eb:`step ${i+1} of the ritual · ${r.n}`,h:r.cta,p:r.ask,offers:picks};
  }
  return null;
}
function subtotal(){return S.lines.reduce((a,l)=>a+P[l.h].p*l.q,0);}
function subSavings(){return S.lines.reduce((a,l)=>a+(l.sub?P[l.h].p*l.q*SUB_PCT:0),0);}
function ritualPotential(){return (subtotal()-subSavings())*RITUAL_PCT;}
function ritualOff(){return S.claimed?(subtotal()-subSavings())*RITUAL_PCT:0;}
function intlOff(){return (S.region==='intl'&&subtotal()>=INTL_MIN)?(subtotal()-subSavings()-ritualOff())*INTL_PCT:0;}
function total(){return Math.max(0,subtotal()-subSavings()-ritualOff()-intlOff());}
function count(){return S.lines.reduce((a,l)=>a+l.q,0);}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1900);}
function add(h,fromOffer){
  openCart();
  const l=S.lines.find(x=>x.h===h);
  if(l)l.q++; else S.lines.push({h,q:1,sub:false,freq:FREQ_DEF});
  if(fromOffer){S.claimed=true;toast('10% ritual discount applied to this cart');}
  else toast(P[h].t.replace('Your ','')+' added');
  render();
}

    return `<div class="ship ${done?'done':''}">

/* [4] product-specific proof */
function proofHTML(){
  if(!CART_TESTIMONIAL) return '';
  // the review shown is the one for the highest-value line in the cart — the
  // item the customer is most likely to hesitate over. If that product has no
  // review yet, fall through to the next most valuable rather than show nothing.
  const ranked=[...S.lines].sort((a,b)=>P[b.h].p*b.q-P[a.h].p*a.q);
  const l=ranked.find(x=>REVIEWS[x.h]); if(!l) return '';
  const pr=P[l.h], rv=REVIEWS[l.h];
  const others=ranked.filter(x=>x!==l&&REVIEWS[x.h]).length;
  return `<div class="proof">
    <div class="hd"><span class="stars">${stars(pr.r)}</span>
      <span class="sc tab">${pr.r.toFixed(2)} · ${pr.n} reviews</span>
      <span class="pill">judge.me verified</span></div>
    ${rv.t?`<div class="rvt">${esc(rv.t)}</div>`:''}
    <blockquote>“${esc(rv.q)}”</blockquote>
    <cite>${esc(rv.a)}</cite>
    <div class="about">on the ${esc(pr.t.replace('Your ','').toLowerCase())} — in your cart${
      others?` · +${others} more reviewed item${others>1?'s':''}`:''}</div></div>`;
}

        <div class="r">subscribe <b class="tab">${money(sb)}</b></div>
        <div class="r big">you save <b class="tab">${money(save)} today + ${money(save*12)}/year</b></div>
      </div>
      <div class="perks" style="background:none;padding:8px 0 0">
        <span>skip anytime</span><span>pause anytime</span><span>min. 2 orders</span></div>
      <p style="font-size:10px;line-height:1.5;color:var(--pk-ink);margin:8px 0 0">
        a minimum of two purchases is required (your initial order and your first renewal).
        after your first renewal, cancel any time at ${SUB_MAIL}</p>
    </div>
    <button class="go" type="button" data-plan="${i}:1">subscribe &amp; save ${money(save)}</button>
    <button class="no" type="button" data-close>no thanks, order once</button>
  </div>`;
  $('#scrim').hidden=false;
}
/* ---------------- events ---------------- */
function wire(){
  $('#body').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    const [i,d]=b.dataset.q.split(':').map(Number);
    S.lines[i].q+=d; if(S.lines[i].q<1)S.lines.splice(i,1); render();});
  $('#body').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.lines.splice(+b.dataset.rm,1);render();});
  document.querySelectorAll('#body [data-add],#ritual [data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add,false));
  document.querySelectorAll('#ritual [data-full]').forEach(b=>b.onclick=()=>{
    S.claimed=true; add('everything-set',false); toast('full set added — 10% off applied');});
  $('#body').querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>add(b.dataset.offer,true));
  $('#body').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});
  $('#body').querySelectorAll('[data-benefits]').forEach(b=>b.onclick=()=>openBenefits(+b.dataset.benefits));
  $('#body').querySelectorAll('[data-freq]').forEach(sel=>sel.onchange=()=>{
    const i=+sel.dataset.freq, d=+sel.value;
    S.lines[i].freq=d; S.lines[i].sub=true; render();
    toast('delivery set to every '+d+' days');});
  document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{
    const [i,on]=b.dataset.plan.split(':').map(Number);
    S.lines[i].sub=!!on; $('#scrim').hidden=true; render();
    toast(on?'subscription applied — 10% off':'switched to a one-time order');});
  const co=$('#co'); if(co) co.onclick=()=>{
    if(preCheckout()) return;                // interrupt once, then let them through
    toast('this is a mockup — checkout is not connected'); };
}
$('#scrim').addEventListener('click',e=>{
  if(e.target.id==='scrim'||e.target.closest('[data-close]')) $('#scrim').hidden=true;
  const pl=e.target.closest('[data-plan]');
  if(pl){const[i,on]=pl.dataset.plan.split(':').map(Number);S.lines[i].sub=!!on;$('#scrim').hidden=true;render();
    toast(on?'subscription applied — 10% off':'switched to a one-time order');}
});

document.querySelector('#igrid').innerHTML = IG.map(([f,c],i)=>`<a class="igt" href="#" data-ig="${i}">
  <img src="${f}" alt="${esc(c)}" loading="lazy">
  <div class="ov">♡ view post</div>
  ${i%3===0?'<span class="shop">shop this</span>':''}</a>`).join('');
document.querySelectorAll('[data-ig]').forEach(a=>a.onclick=e=>{e.preventDefault();
  toast('instagram post — links out to @yoursaha');});
document.querySelector('#iglink').onclick=e=>{e.preventDefault();toast('opens instagram.com/yoursaha');};

/* [item 7] the pop-up that interrupts checkout. Suggestions only, no prices —
   the point is completing the routine, not comparing costs. */
function preCheckoutPicks(){
  const top=[...S.lines].sort((x,y)=>P[y.h].p*y.q-P[x.h].p*x.q)[0];
  if(!top) return {anchor:null,picks:[]};
  let pool=(PAIRS[top.h]||[]).filter(h=>!has(h));
  const o=offerFor();
  (o?o.offers:[]).forEach(h=>{ if(!has(h)&&!pool.includes(h)) pool.push(h); });
  // one product per type — suggesting two gloves is not a pairing
  const seen=new Set(S.lines.map(l=>P[l.h].tag)), picks=[];
  pool.forEach(h=>{ if(!seen.has(P[h].tag)){ seen.add(P[h].tag); picks.push(h); } });
  return {anchor:P[top.h], picks:picks.slice(0,3)};
}
function preCheckout(){
  const {anchor,picks}=preCheckoutPicks();
  if(!picks.length||S.preShown) return false;
  S.preShown=true;
  const names=picks.map(h=>P[h].t.replace('Your ','').toLowerCase());
  $('#atc').innerHTML=`<div class="atcbox" role="dialog" aria-modal="true" aria-label="Complete your routine">
    <button class="x2" type="button" data-atcclose aria-label="Close">✕</button>
    <div class="atceb">before you check out</div>
    <h3>pair it with ${esc(names.join(' + '))}</h3>
    <p class="atcsub">Your ${esc(anchor.t.replace('Your ','').toLowerCase())} works best as part of the
      whole routine — and it all ships together.</p>
    <div class="atccards">${picks.map(h=>{const pr=P[h];return `<button class="atccard" type="button" data-pair="${h}">
      <span class="plus" aria-hidden="true">+</span>
      <img src="${pr.img}" alt="" loading="lazy">
      <span class="cn">${esc(pr.t.replace('Your ',''))}</span>
      <span class="cm">${esc(pr.m)}</span></button>`}).join('')}</div>
    <button class="atcgo" type="button" data-atcgo>continue to checkout</button></div>`;
  $('#atc').hidden=false;
  return true;
}
$('#atc').addEventListener('click',e=>{
  const pick=e.target.closest('[data-pair]');
  if(pick){                                  // add in place, without closing the pop-up
    const h=pick.dataset.pair;
    S.lines.push({h,q:1,sub:false,freq:FREQ_DEF}); render();
    pick.classList.add('added'); pick.querySelector('.plus').textContent='✓';
    pick.disabled=true; toast(P[h].t.replace('Your ','')+' added');
    return;
  }
  if(e.target.closest('[data-atcgo]')){ $('#atc').hidden=true;
    toast('this is a mockup — checkout is not connected'); return; }
  if(e.target.closest('[data-atcclose]')||e.target.id==='atc') $('#atc').hidden=true;
});

function openCart(){ $('#drawerwrap').classList.remove('closed'); $('#pagescrim').classList.remove('closed'); }
function closeCart(){ $('#drawerwrap').classList.add('closed'); $('#pagescrim').classList.add('closed'); $('#scrim').hidden=true; }
$('#opencart').onclick=openCart;
$('#pagescrim').onclick=closeCart;
document.addEventListener('click',e=>{ if(e.target.closest('.dhead .x')) closeCart(); });
document.addEventListener('keydown',e=>{ if(e.key!=='Escape')return;
  if(!$('#atc').hidden){ $('#atc').hidden=true; return; }
  if(!$('#scrim').hidden){ $('#scrim').hidden=true; return; }   // close the pop-up first
  closeCart(); });

/* the store's own country selector drives the shipping rule */
$('#country').onchange=e=>{ S.region=e.target.value; render(); };


load('soap');
</script>
